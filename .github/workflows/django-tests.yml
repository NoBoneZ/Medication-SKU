name: Run axmed Tests

on:
  pull_request:
    branches:
      - main  # Specify the branch to run tests against (e.g., main)

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: github
          POSTGRES_PASSWORD: github
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Set up Database
      run: |
        python manage.py migrate

    - name: Run Tests
      env:
        DATABASE_URL: postgres://github:github@localhost:5432/test_db
      run: |
        python manage.py test
